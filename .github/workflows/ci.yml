name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version
      - run: go mod verify
      - run: go test ./...
      - run: go build -o im-alter .
      - name: Check usage error
        run: |
          status=0
          ./im-alter || status=$?
          test "$status" -eq 2
      - run: GOARCH=amd64 go build -o "$RUNNER_TEMP/im-alter-amd64" .
