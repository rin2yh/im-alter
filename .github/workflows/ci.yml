name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: commitlint.config.mjs

  test:
    runs-on: macos-15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version
      - run: go mod verify
      - run: go test ./...
      - run: go build -o "$RUNNER_TEMP/im-alter" .
      - name: Check usage error
        run: |
          status=0
          "$RUNNER_TEMP/im-alter" || status=$?
          test "$status" -eq 2

  build:
    needs: test
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Build for macOS
        run: GOARCH=${{ matrix.goarch }} go build -trimpath -o "$RUNNER_TEMP/im-alter-${{ matrix.goarch }}" .
