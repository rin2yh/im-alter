name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/go_modules/')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge the tested Dependabot commit
        run: |
          pr=$(gh pr list --base "$BASE_BRANCH" --head "$HEAD_BRANCH" \
            --json number,author,headRefOid,isDraft,isCrossRepository,files \
            | jq -r --arg sha "$HEAD_SHA" '
                .[] | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot")
                | select(.headRefOid == $sha and (.isDraft or .isCrossRepository | not))
                | select((.files | length) > 0 and all(.files[]; .path == "go.mod" or .path == "go.sum"))
                | .number')
          if [[ -z "$pr" ]]; then
            exit 0
          fi
          gh pr merge "$pr" --squash --match-head-commit "$HEAD_SHA"
          # A merge made with GITHUB_TOKEN does not trigger tagpr's push workflow.
          gh workflow run tagpr.yml --ref "$BASE_BRANCH"
