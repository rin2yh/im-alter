version: 2
project_name: im-alter
builds:
  - main: .
    binary: im-alter
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [darwin]
    goarch: [amd64, arm64]
archives:
  - name_template: 'im-alter_v{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  use_existing_draft: true
  draft: false
  prerelease: auto
